<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="Naufal Marufa Ashrori — Full-Stack Web Developer building clean, fast, and maintainable web applications with Laravel and React." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio_theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var isDark = stored === 'dark' || (!stored && !prefersLight);
          if (!isDark) document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>

    <title>Naufal Marufa Ashrori — Full-Stack Web Developer</title>
  </head>
  <body class="bg-slate-50 dark:bg-[#0a0a0f] text-slate-700 dark:text-zinc-300 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
